name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*', 'chart-v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint charts/auditbridge

      - name: Render Helm chart
        run: helm template auditbridge charts/auditbridge --set envFromSecret.NETBIRD_API_TOKEN=netbird-audit/audit-token --set metrics.serviceMonitor.enabled=true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Dependency advisories, licenses, and bans
        uses: EmbarkStudios/cargo-deny-action@v2

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Every push/PR builds and scans a single-arch image for fast
      # feedback. Nothing here is pushed, so no registry login, no QEMU,
      # no multi-arch build for a manifest list that gets thrown away.
      - name: Build image for vulnerability scan
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: auditbridge:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ignore-unfixed: debian:bookworm-slim carries HIGH/CRITICAL CVEs with
      # no upstream fix (will_not_fix/fix_deferred). A fixable one still
      # fails the build; an unfixable base-image gap would leave CI red
      # forever for nothing this project can act on.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'auditbridge:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      # Everything below only runs on a vX.Y.Z tag, the only event that
      # actually publishes. main-branch pushes build and scan above but
      # ship nothing, so `latest` only ever points at a real tagged release.
      - name: Log into Docker Hub
        if: startsWith(github.ref, 'refs/tags/v') && env.DOCKER_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log into GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && env.IMAGE_NAME || '' }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Set up QEMU (for arm64 builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v4

      - name: Build and push multi-arch image
        if: startsWith(github.ref, 'refs/tags/v')
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  publish-chart:
    if: startsWith(github.ref, 'refs/tags/chart-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Verify chart release version
        run: test "${GITHUB_REF_NAME#chart-v}" = "$(helm show chart charts/auditbridge | awk '/^version:/{print $2}')"

      # OCI publishing keeps chart releases independent from application releases.
      - name: Publish chart to GHCR
        env:
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin <<< "$HELM_REGISTRY_PASSWORD"
          helm package charts/auditbridge --destination .chart-artifacts
          helm push .chart-artifacts/auditbridge-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
