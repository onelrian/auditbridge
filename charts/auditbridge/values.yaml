global:
  namespace: ""

nameOverride: ""
fullnameOverride: ""
replicaCount: 1

image:
  repository: ghcr.io/onelrian/auditbridge
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  enabled: true
  type: ClusterIP
  port: 9090
  name: metrics
  annotations: {}

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

env: {}
envRaw: []

# Map environment variable names to existing Secret references.
# Example: NETBIRD_API_TOKEN: netbird-audit/audit-token
envFromSecret: {}

nodeSelector: {}
tolerations: []
affinity: {}
volumeMounts: []
volumes: []

metrics:
  # Port used by AuditBridge's health and Prometheus server.
  port: 9090
  serviceMonitor:
    enabled: false
    namespace: ""
    annotations: {}
    labels: {}
    jobLabel: ""
    honorLabels: false
    interval: ""
    scrapeTimeout: ""
    metricRelabelings: []
    relabelings: []
