[package]
name = "signal"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }

# HTTP client for Loki - use native-tls to match OpenSSL 1.1
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "native-tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time handling
chrono = { version = "0.4", features = ["serde", "clock"] }

# Error handling
anyhow = "1"

# Enables `dyn Sink` trait objects for the pluggable sink fan-out
async-trait = "0.1"

# Jitter for retry/backoff
rand = "0.8"

# /healthz, /readyz, /metrics HTTP server (already share hyper/tower with reqwest)
axum = "0.7"

# Logging + tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
temp-env = "0.3.6"

